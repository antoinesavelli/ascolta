[project]
name = "ascolta"
version = "0.1.0"
description = "Record a call on Linux, then transcribe, translate and summarize it with local models, checking every cited quote in code."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "av==18.1.0",
    "pyyaml>=6",
]

[project.scripts]
ascolta = "ascolta.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the GPU and the cached Whisper model",
    "ollama: needs the local Ollama server and the pinned models",
    "pipewire: needs a running PipeWire session",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "TID", "S602", "S604", "S605", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ascolta"]
mypy_path = "typings"
